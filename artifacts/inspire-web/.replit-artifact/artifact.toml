kind = "web"
previewPath = "/"
title = "INSPIRE Framework"
version = "1.0.0"
id = "artifacts/inspire-web"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 24301

[services.development]
run = "pnpm --filter @workspace/inspire-web run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/inspire-web", "run", "build" ]
publicDir = "artifacts/inspire-web/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "24301"
BASE_PATH = "/"
